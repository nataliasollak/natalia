<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuários</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    #mensagem {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cadastro de Usuário</h2>

    <form id="formulario>
      <input type="text" id="cpf" placeholder="CPF" required />
      <input type="text" id="nome" placeholder="Nome" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="text" id="telefone" placeholder="Telefone" required />
      <input type="password" id="senha" placeholder="Senha" required />
      <button type="submit">Salvar</button>
    </form>

    <div id="mensagem"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
       apiKey: "AIzaSyBTx1yixNaDFuPtMoEi5LjjO4pQVLYlQ2A",
  authDomain: "cprojeto-e276c.firebaseapp.com",
  projectId: "cprojeto-e276c",
  storageBucket: "cprojeto-e276c.firebasestorage.app",
  messagingSenderId: "720537111219",
  appId: "1:720537111219:web:ab7a8cb5d704c710e07ec6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formulario");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const cep = document.getElementById("cep").value;
      const cpf = document.getElementById("cpf").value;
      const data_nascimento = document.getElementById("data_nascimento").value;
      const email = document.getElementById("email").value;
       const foto = document.getElementById("foto").value;
      const idade = document.getElementById("idade").value;
      const rg = document.getElementById("rg").value;
      const senha = document.getElementById("senha").value;
      const telefone = document.getElementById("telefone").value;

      try {
        await addDoc(collection(db, "usuarios"), {
          nome,
          cep,
          cpf,
          data_nascimento,
          email,
          foto,
          idade,
          rg,
          senha,
          telefone
        });

        mensagem.textContent = "Usuário salvo com sucesso.";
        mensagem.style.color = "green";
        form.reset();
      } catch (error) {
        mensagem.textContent = "Erro ao salvar: " + error.message;
        mensagem.style.color = "red";
      }
    });
  </script>
</body>
</html>
